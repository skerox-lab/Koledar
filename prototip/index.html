<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montaža Škerjanec Digital · vzorec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --panel2:#F5F7F9; --line:#D9DFE5; --line2:#C3CBD3;
  --ink:#16202B; --ink2:#4A5866; --ink3:#7C8894;
  --blue:#1D5FA6; --blue-bg:#E3EDF8; --b1:#EEF4FB; --b2:#E1ECF8; --b3:#D1E2F4; --thread:#C21F3A; --thread-bg:#FBE7EA;
  --ok:#2E7D4F; --ok-bg:#E3F2E8; --warn:#9A5B00; --warn-bg:#FCF0D9; --bad:#B42318; --bad-bg:#FBE5E2;
  --c1:#E3EDF8; --c1t:#1D4F86; --c2:#E3F2E8; --c2t:#245F3E; --c3:#FCF0D9; --c3t:#7A4A00; --c4:#EDE7F8; --c4t:#4A3A86; --c5:#E6F1F1; --c5t:#2A5E5E;
  --r:6px; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand .lgl{display:none} :root:not([data-theme="light"]) .brand .lgd{display:block} :root:not([data-theme="light"]){
  --bg:#12171D; --panel:#1A2129; --panel2:#212A33; --line:#2E3842; --line2:#3C4752;
  --ink:#E6EBF0; --ink2:#AEB9C4; --ink3:#7F8B97;
  --blue:#7FB0E8; --blue-bg:#1C3350; --b1:#172A40; --b2:#1C3350; --b3:#233F62; --thread:#F0647A; --thread-bg:#3A1A22;
  --ok:#7CCB9A; --ok-bg:#1B3326; --warn:#F2B860; --warn-bg:#3A2C12; --bad:#F59A8E; --bad-bg:#3B1C18;
  --c1:#1C3350; --c1t:#A9CBF2; --c2:#1B3326; --c2t:#9FD8B4; --c3:#3A2C12; --c3t:#F2CF94; --c4:#2B2445; --c4t:#C9BCF2; --c5:#173333; --c5t:#9FD4D4;
}}
:root[data-theme="dark"] .brand .lgl{display:none} :root[data-theme="dark"] .brand .lgd{display:block}
:root[data-theme="dark"]{
  --bg:#12171D; --panel:#1A2129; --panel2:#212A33; --line:#2E3842; --line2:#3C4752;
  --ink:#E6EBF0; --ink2:#AEB9C4; --ink3:#7F8B97;
  --blue:#7FB0E8; --blue-bg:#1C3350; --b1:#172A40; --b2:#1C3350; --b3:#233F62; --thread:#F0647A; --thread-bg:#3A1A22;
  --ok:#7CCB9A; --ok-bg:#1B3326; --warn:#F2B860; --warn-bg:#3A2C12; --bad:#F59A8E; --bad-bg:#3B1C18;
  --c1:#1C3350; --c1t:#A9CBF2; --c2:#1B3326; --c2t:#9FD8B4; --c3:#3A2C12; --c3t:#F2CF94; --c4:#2B2445; --c4t:#C9BCF2; --c5:#173333; --c5t:#9FD4D4;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:5px 11px;cursor:pointer}
button:hover{background:var(--panel2)}
button.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
:root[data-theme="dark"] button.pri{color:#0E1A28}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.pri{color:#0E1A28}}
button.sm{padding:2px 8px;font-size:12px}
input,select{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:4px 7px}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 16px;font-weight:600;font-size:16px}
.brand{flex-direction:column;align-items:flex-start;gap:2px;width:max-content}.brand .lg{display:block;width:160px;height:auto}.brand .lgd{display:none}.brand .bt{display:flex;align-items:center;gap:7px;font-family:Montserrat,"Instrument Sans",system-ui,sans-serif;font-weight:800;font-size:16px;line-height:1;letter-spacing:.12em;text-transform:uppercase;color:#1F91D8;padding-left:.12em;align-self:center;text-align:center}.brand .bt i{width:8px;height:8px;background:#1F91D8;transform:rotate(-12deg);border-radius:1px;display:inline-block}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:var(--r);color:var(--ink2);text-decoration:none;cursor:pointer}
.nav a:hover{background:var(--panel2)}
.nav a.on{background:var(--blue-bg);color:var(--blue);font-weight:500}
.nav .ct{font-size:11px;background:var(--warn-bg);color:var(--warn);border-radius:9px;padding:0 6px}
.navsep{height:1px;background:var(--line);margin:10px 6px}
.main{min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.bad{color:var(--bad)} .sync.bad .dot{background:var(--bad)}
.content{padding:20px 22px 40px;max-width:1180px}
h1{font-size:22px;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600;margin:0 0 10px}
.sub{color:var(--ink3);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.pad{padding:14px 16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.met{background:var(--panel2);border-radius:var(--r);padding:10px 12px}
.met .l{font-size:12px;color:var(--ink2)} .met .v{font-size:19px;font-weight:600}
.met.blue{background:var(--blue-bg)} .met.b1{background:var(--b1)} .met.b2{background:var(--b2)} .met.b3{background:var(--b3)} .met.blue .l{color:var(--blue)} .met.blue .v{color:var(--blue)}
.met.warn{background:var(--warn-bg)} .met.warn .l,.met.warn .v{color:var(--warn)}
.met.ok{background:var(--ok-bg)} .met.ok .l,.met.ok .v{color:var(--ok)}
.met.bad{background:var(--bad-bg)} .met.bad .l,.met.bad .v{color:var(--bad)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-weight:500;color:var(--ink2);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--panel2)}
table.t .n{text-align:right;white-space:nowrap}
table.t tr.grp td{background:var(--panel2);font-weight:500;color:var(--ink2);font-size:12px}
table.t tr.sum td{font-weight:600;border-bottom:none}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:9px;white-space:nowrap}
.b-blue{background:var(--blue-bg);color:var(--blue)} .b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)}
.b-gray{background:var(--panel2);color:var(--ink2);border:1px solid var(--line)}
.b-hand{background:var(--warn-bg);color:var(--warn);font-size:10px;padding:1px 6px;margin-right:4px}
.muted{color:var(--ink3)} .small{font-size:12px}
.warnline{color:var(--warn)} .badline{color:var(--bad)} .okline{color:var(--ok)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 0;overflow-x:auto}
.tabs a{padding:9px 13px;color:var(--ink2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.tabs a .lk{font-size:11px;color:var(--ink3)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pills a{padding:4px 11px;border-radius:14px;cursor:pointer;color:var(--ink2);border:1px solid var(--line);background:var(--panel);font-size:13px}
.pills a.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.thread{--n:4;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);margin:28px 0 12px}
.thread:before{content:"";position:absolute;left:calc(50% / var(--n));right:calc(50% / var(--n));top:8px;height:2px;background:var(--line2)}
.thread .fill{position:absolute;left:calc(50% / var(--n));top:8px;height:2px;background:var(--thread)}
.thread .st{position:relative;text-align:center;font-size:12px;color:var(--ink3)}
.thread .st b{display:block;width:18px;height:18px;border-radius:50%;margin:0 auto 4px;background:var(--panel);border:2px solid var(--line2)}
.thread .st.done b{background:var(--thread);border-color:var(--thread)}
.thread .st.now b{border-color:var(--thread);box-shadow:0 0 0 4px var(--thread-bg)}
.thread .st.done,.thread .st.now{color:var(--ink)}
.mini{display:inline-flex;align-items:center;gap:0;vertical-align:middle}
.mini i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line2);background:var(--panel);display:inline-block}
.mini i.d{background:var(--thread);border-color:var(--thread)} .mini i.c{border-color:var(--thread)}
.mini s{width:10px;height:1.5px;background:var(--line2);display:inline-block} .mini s.d{background:var(--thread)}
.list .row{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}.list .row>button,.list .row>span.small{align-self:center;flex:none;white-space:nowrap} .list .row:last-child{border-bottom:none}
.ic{width:18px;flex:none;text-align:center;font-weight:600}
.qin{width:68px;text-align:right;padding:3px 5px}
.cell{width:100%;min-width:0;text-align:center;padding:6px 2px;border-radius:4px;border:1px solid transparent;font-size:12px;text-transform:uppercase}
.cell:focus{border-color:var(--blue);outline:none}
.pg{display:grid;grid-template-columns:150px repeat(7,minmax(64px,1fr));gap:3px;align-items:center;min-width:640px}
.pg .h{font-size:12px;color:var(--ink2);text-align:center}
.ug{display:grid;grid-template-columns:110px repeat(6,minmax(74px,1fr)) 54px;gap:3px;align-items:center;min-width:640px}
.ug .h{font-size:12px;color:var(--ink2);text-align:center}
.planned{border:1px dashed var(--line2)!important;color:var(--ink3)}
.folder{display:flex;justify-content:space-between;padding:8px 10px;border-radius:var(--r);cursor:pointer}
.folder:hover,.folder.on{background:var(--panel2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:var(--r);font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.on{opacity:1}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .between{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.mt{margin-top:14px} .mb{margin-bottom:14px}
.note{background:var(--panel2);border-radius:var(--r);padding:8px 12px;font-size:12px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px} .kv span:nth-child(odd){color:var(--ink3)}
.lock{padding:30px;text-align:center;color:var(--ink2)}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:6;padding:8px;display:flex;align-items:center;gap:6px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
  .brand{padding:0 6px 0 2px;flex-direction:row;align-items:center;gap:6px}.brand .lg{width:96px}.brand .bt{font-size:12px}
  .nav{display:flex;gap:2px} .nav a{white-space:nowrap} .navsep{display:none}
  .top{position:static}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))} .grid2,.grid3{grid-template-columns:1fr}
  .content{padding:16px 12px 40px}
}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.uiask{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}.uiask-b{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:460px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}.uiask-i{width:100%;box-sizing:border-box;margin-bottom:12px}
.pname{width:100%;min-width:0;font-size:12px;padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
</style>

function kalcerSup(){return Object.values(SUPC).find(c=>/kalcer/i.test(c.name))||null}
function kalcerIdx(){const c=kalcerSup();if(!c)return null;if(c._ix&&c._ixr===c.rows)return c._ix;const ix={},cnt={};c.rows.forEach(r=>{const k=cNorm(r[2]);cnt[k]=(cnt[k]||0)+1;ix[k+'#'+cnt[k]]=r});c._ix=ix;c._ixr=c.rows;return ix}
function kPrice(name){const L=KLINK[name];const ix=kalcerIdx();if(!L||!ix)return null;const r=ix[cNorm(L[0])+'#'+(L[1]||1)];if(!r)return null;const p=cNum(r[4]);return p==null?null:{p:p*(L[2]||1),row:r,note:L[3]||''}}
function kItem(it){const k=kPrice(it[0]);const p=k?k.p:it[3];return {it,p,k,net:p*(1-it[4]/100)*(1-it[5]/100),old:it[3]}}
function kPlate(t){const ix=kalcerIdx();const r=ix&&ix[cNorm(PLATEN[t])+'#1'];const p=r?cNum(r[4]):null;return p!=null?{p,ok:true}:{p:PLATE[t],ok:false}}
function rangeMid(t){if(typeof t==='number')return t;const m=String(t).match(/^(\d+(?:[.,]\d+)?)\s*[–-]\s*(\d+(?:[.,]\d+)?)$/);if(m)return (cNum(m[1])+cNum(m[2]))/2;return cNum(t)}
function koopLink(code){const n=KOOPLINK[code];const r=n&&CEN_KOOP.find(x=>cNorm(x[0])===cNorm(n));if(r){const v=rangeMid(r[2]);if(v!=null)return {v,src:r[0]+' · '+r[2]+(String(r[2]).match(/[–-]/)?' → sredina '+e(v):''),ok:true}}return SYSKOOP[code]!=null?{v:SYSKOOP[code],src:'postavke »'+(n||code)+'« ni v ceniku kooperantov, vzeta stara vrednost',ok:false}:null}

async function supDel(k){const c=SUPC[k];if(!c)return;if(!await uiConfirm('Izbrišem cenik dobavitelja '+c.name+'?\n\nCenik se odstrani iz seznama. Dobavnice in računi na objektih ostanejo.'))return;delete SUPC[k];CENX=CENX||{ver:{}};CENX.supdel=[...new Set([...(CENX.supdel||[]),k])];if(CENX.supc)delete CENX.supc[k];if(CENX.ver)delete CENX.ver['sup:'+k];if(S.dsel===k)S.dsel=null;log('Ceniki, Dobavitelji','izbrisan cenik '+c.name);save();render();toast('Cenik '+c.name+' izbrisan')}
function cenKey(){return S.cen==='dobavitelji'?(S.dsel?'sup:'+S.dsel:'sup:'):S.cen}
function cenVerLine(){const V=(CENX&&CENX.ver&&CENX.ver[cenKey()])||[];if(!V.length)return '';const v=V[0];return `<div class="small muted mb">Zadnja osvežitev ${fd(v.at)} · velja od ${fd(v.date)} · iz datoteke »${v.file}« · ${v.n} postavk${V.length>1?' · prej '+V.slice(1,4).map(x=>fd(x.date)).join(', '):''}</div>`}
const cNorm=t=>String(t||'').toLowerCase().replace(/×/g,'x').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'');
function cNum(c){if(typeof c==='number')return c;const t=String(c||'').trim().replace(/\s*€$/,'').replace(/^€\s*/,'');if(!/^-?\d{1,3}([.\s]\d{3})*(,\d+)?$|^-?\d+([.,]\d+)?$/.test(t))return null;let x=t.replace(/\s/g,'');if(x.includes(','))x=x.replace(/\./g,'').replace(',','.');return parseFloat(x)}
const CEM=/^(m²|m2|m¹|m1|m|m³|m3|kos|kom|h|ura|ur|kpl|kg|l|pak|pal|zav|rola|t)$/i;
async function cenReadFile(file){const name=file.name.toLowerCase();const buf=await file.arrayBuffer();
 if(/\.(xlsx|xls|csv)$/.test(name)){if(typeof XLSX==='undefined')throw new Error('Knjižnica za Excel se še nalaga, poskusi znova');const wb=XLSX.read(buf,{type:'array'});let L=[];wb.SheetNames.forEach(n=>{L=L.concat(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}).map(r=>r.map(c=>typeof c==='string'?c.trim():c).filter(c=>c!==''&&c!=null)))});return L.filter(r=>r.length)}
 if(/\.pdf$/.test(name)){if(!window.pdfjsLib)throw new Error('Knjižnica za PDF se še nalaga, poskusi znova');if(!window.pdfjsWorker)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;const L=[];
  for(let p=1;p<=doc.numPages;p++){const tc=await (await doc.getPage(p)).getTextContent();const lines={};tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]/3);(lines[y]=lines[y]||[]).push({x:it.transform[4],w:it.width||0,t:it.str})});
   Object.keys(lines).map(Number).sort((a,b)=>b-a).forEach(y=>{const it=lines[y].sort((a,b)=>a.x-b.x);const cells=[];let cur=null;it.forEach(o=>{if(cur&&o.x-(cur.x+cur.w)<4){cur.t+=(o.x-(cur.x+cur.w)>1?' ':'')+o.t;cur.w=o.x+o.w-cur.x}else{cur={x:o.x,w:o.w,t:o.t};cells.push(cur)}});L.push(cells.map(c=>c.t.trim()).filter(Boolean))})}
  return L}
 throw new Error('Podprti so PDF, XLSX, XLS in CSV')}
function cenParse(tab,L){const out=[];let sec='',chap='';
 L.forEach(r=>{const nums=r.map((c,i)=>{if(typeof c==='number')return c;const t=String(c).trim();if(/[.,]\d{1,2}$/.test(t)||(tab!=='dobavitelji'&&i===r.length-1&&/^\d+$/.test(t)))return cNum(t);return null});const txt=r.filter((c,i)=>nums[i]==null&&!CEM.test(String(c).trim()));const em=(r.find(c=>CEM.test(String(c).trim()))||'');
  if(tab==='sistemi'){const line=r.join(' ');const code=(line.match(/\b([WD]\d{3})\b/)||[])[1];const var_=(line.match(/\bPS\s*\d+\s*\/\s*\d+|\b[A-Z]{1,3}\s?\d{2}\s?\/\s?\d{2,3}\b/)||[])[0];const ns=nums.filter((n,i)=>n!=null&&n>5&&String(r[i]).match(/[.,]|^\d{2,}$/));if(!code&&!var_)return;if(!ns.length)return;out.push({code:code||'',v:(var_||'').replace(/\s*\/\s*/,'/').replace(/^PS\s*/,'PS '),p:ns.slice(-3)});return}
  const range=r.find(c=>/^\d+([.,]\d+)?\s*[–-]\s*\d+([.,]\d+)?$/.test(String(c).trim()));
  const pi=nums.map((n,i)=>n!=null?i:-1).filter(i=>i>=0);const name=txt.sort((a,b)=>String(b).length-String(a).length)[0];
  if(!pi.length&&!range){if(tab==='dobavitelji'&&r.length<=2&&name&&String(name).length>3){const t=String(name);if(/^CENIK\s/i.test(t))chap=t.replace(/^CENIK\s+/i,'');else if(!/^(NAZIV|kalcer|tel|fax)/i.test(t))sec=t}return}
  if(!name||String(name).length<3||/^(postavka|opis|naziv|artikel|šifra)/i.test(name))return;
  let price=range?String(range).replace('-','–'):nums[pi[pi.length-1]];
  if(tab==='dobavitelji'&&pi.length>=2){const a=nums[pi[pi.length-2]],b=nums[pi[pi.length-1]];if(Math.abs(b-a*1.22)<0.02*a+0.02)price=a}
  if(typeof price==='number'&&(price<=0||price>100000))return;
  out.push({name:String(name).replace(/\s+/g,' ').replace(/(\d)x(\d)/g,'$1×$2'),em:String(em).replace('m2','m²').replace('m1','m¹'),p:price,sec,chap})});
 return out}
function cenCur(tab){if(tab==='sistemi')return SYS.map(r=>({k:cNorm(r[1]),name:r[0]+' '+r[1],p:r[3]}));if(tab==='dodatna')return CEN_DOD.map(r=>({k:cNorm(r[0]),name:r[0],p:r[2]}));if(tab==='kooperanti')return CEN_KOOP.map(r=>({k:cNorm(r[0]),name:r[0],p:r[2]}));const c=SUPC[S.dsel]||{rows:[]};return c.rows.map(r=>({k:cNorm(r[2]+r[3]),name:r[2],p:r[4]}))}
function cenDiff(tab,P){const cur=cenCur(tab);const cm={};cur.forEach(x=>cm[x.k]=x);const fmtP=p=>typeof p==='number'?e(p):String(p);const ch=[],nw=[];const seen={};
 P.forEach(x=>{const k=tab==='sistemi'?cNorm(x.v):tab==='dobavitelji'?cNorm(x.name+x.em):cNorm(x.name);const p=tab==='sistemi'?x.p[0]:x.p;seen[k]=1;const o=cm[k];if(!o)nw.push({name:tab==='sistemi'?(x.code+' '+x.v):x.name,nw:fmtP(p)});else if(fmtP(o.p)!==fmtP(p))ch.push({name:o.name,old:fmtP(o.p),nw:fmtP(p)})});
 const gone=cur.filter(x=>!seen[x.k]);return {ch,nw,gone}}
function cenModal(html){let w=document.getElementById('cenm');if(!w){w=document.createElement('div');w.id='cenm';w.className='uiask';document.body.appendChild(w)}w.innerHTML=`<div class="uiask-b" role="dialog" aria-modal="true" style="max-width:680px;max-height:86vh;overflow:auto">${html}</div>`}

const cToday=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

 cenModal(`<h2 style="margin:0 0 4px">Osveži cenik · ${CENT[tab]}${sup&&SUPC[sup]?' · '+SUPC[sup].name:sup==='__new'?' · nov dobavitelj':''}</h2><div class="small muted" style="margin-bottom:14px">Priloži osveženo verzijo cenika v obliki PDF ali Excel. Pred zamenjavo ti pokažem, katere cene so se spremenile.</div>
 ${tab==='dobavitelji'?`<label class="small">Dobavitelj</label><select id="cen_sup" style="width:100%;margin:4px 0 10px" onchange="document.getElementById('cen_nw').style.display=this.value==='__new'?'block':'none'">${Object.entries(SUPC).map(([k,c])=>`<option value="${k}" ${k===sup?'selected':''}>${c.name}</option>`).join('')}<option value="__new" ${!SUPC[sup]?'selected':''}>+ nov dobavitelj</option></select><input id="cen_nw" placeholder="naziv dobavitelja, npr. Velux Slovenija d.o.o." style="width:100%;margin:0 0 10px;display:${!SUPC[sup]?'block':'none'}">`:''}
 <label class="small">Datoteka cenika (PDF, XLSX, XLS, CSV)</label><input id="cen_f" type="file" accept=".pdf,.xlsx,.xls,.csv" style="width:100%;margin:4px 0 10px">

async function cenLoad(){const tab=S.cen||'sistemi';const fi=document.getElementById('cen_f');const file=fi&&fi.files[0];const date=document.getElementById('cen_d').value;if(tab==='dobavitelji'){let k=document.getElementById('cen_sup').value;if(k==='__new'){const n=document.getElementById('cen_nw').value.trim();if(!n){toast('Vpiši naziv novega dobavitelja');return}k=cNorm(n).slice(0,24)||'dob';if(!SUPC[k])SUPC[k]={name:n,title:'',date:'',pdf:'',note:'Cenik naložen iz datoteke. Preveri cene z izvirnikom.',rows:[],_new:1};if(CENX&&CENX.supdel)CENX.supdel=CENX.supdel.filter(x=>x!==k)}S.dsel=k}
 if(!file){toast('Priloži datoteko cenika (PDF ali Excel)');return}if(!date){toast('Vpiši datum veljavnosti');return}
 let L;try{L=await cenReadFile(file)}catch(x){toast(x.message||'Datoteke ni bilo mogoče prebrati');return}
 const P=cenParse(tab,L);
 if(!P.length){cenModal(`<h2 style="margin:0 0 8px">Postavk nisem prebral</h2><div style="line-height:1.5">Iz datoteke »${file.name}« nisem uspel prebrati nobene postavke s ceno. Cenik ostaja nespremenjen.<br><br>Najzanesljivejši je Excel z enim stolpcem za opis, enoto in ceno.${tab==='sistemi'?' Pri sistemih mora vrstica vsebovati oznako (npr. PS 12/100) in cene.':''}</div><div class="flex" style="justify-content:flex-end;gap:8px;margin-top:14px"><button onclick="cenRefresh()">Nazaj</button><button class="pri" onclick="cenClose()">Zapri</button></div>`);return}
 const d=cenDiff(tab,P);window._cenP={tab,P,date,file:file.name,sup:S.dsel};
 const tr=(a,b,c,cls)=>`<tr><td>${a}</td><td class="n muted">${b}</td><td class="n ${cls||''}">${c}</td></tr>`;
 cenModal(`<h2 style="margin:0 0 4px">Pregled novega cenika · ${CENT[tab]}</h2><div class="small muted" style="margin-bottom:12px">${file.name} · velja od ${fd(date)}</div>
 <div class="grid4" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px"><div class="met"><div class="l">Prebrano</div><div class="v">${P.length}</div></div><div class="met"><div class="l">Spremenjene cene</div><div class="v">${d.ch.length}</div></div><div class="met"><div class="l">Nove postavke</div><div class="v">${d.nw.length}</div></div><div class="met ${d.gone.length?'warn':''}"><div class="l">${tab==='sistemi'?'Ni v novem ceniku':'Bodo odstranjene'}</div><div class="v">${d.gone.length}</div></div></div>
 <table class="t"><thead><tr><th>Postavka</th><th class="n">Prej</th><th class="n">Novo</th></tr></thead><tbody>${d.ch.slice(0,40).map(x=>tr(x.name,x.old,x.nw)).join('')}${d.nw.slice(0,20).map(x=>tr(x.name,'nova',x.nw,'okline')).join('')}${d.gone.slice(0,20).map(x=>tr(x.name,typeof x.p==='number'?e(x.p):x.p,tab==='sistemi'?'ostane':'odstranjena','badline')).join('')}${!d.ch.length&&!d.nw.length&&!d.gone.length?'<tr><td colspan="3" class="muted">Cene so enake kot v trenutnem ceniku.</td></tr>':''}</tbody></table>

function cenApply(){const X=window._cenP;if(!X)return;const {tab,P}=X;CENX=CENX||{ver:{}};CENX.ver=CENX.ver||{};
 if(tab==='sistemi'){P.forEach(x=>{const k=cNorm(x.v);let r=SYS.find(r=>cNorm(r[1])===k);if(!r){if(!x.code||!x.v)return;r=[x.code,x.v,'',0,0,0];SYS.push(r)}x.p.forEach((p,i)=>{r[3+i]=p})});CENX.sys=SYS.map(r=>r.slice())}

 else{const c=SUPC[X.sup];const f2=n=>n.toFixed(2).replace('.',',');c.rows=P.map(x=>[x.chap||x.sec||'',x.chap?x.sec||'':'',x.name,x.em||'',typeof x.p==='number'?f2(x.p):x.p,typeof x.p==='number'?f2(x.p*1.22):'']);c.date=fd(X.date);c.title=X.file.replace(/\.[a-z]+$/i,'');CENX.supc=CENX.supc||{};CENX.supc[X.sup]={name:c.name,rows:c.rows,date:c.date,title:c.title,note:c.note};delete c._new}
